{% set name = "inflate64" %}
{% set version = "1.0.4" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/inflate64-{{ version }}.tar.gz
  sha256: b398c686960c029777afc0ed281a86f66adb956cfc3fbf6667cc6453f7b407ce

build:
  skip: true  # [py<39]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
  host:
    - pip
    - python
    - setuptools >=45
    - setuptools-scm >=6.0.1
    - toml
  run:
    - python
  run_constrained:
    - mypy >=1.10.0
    - mypy_extensions >=0.4.1

test:
  source_files:
    - tests
  imports:
    - inflate64
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -v tests
  requires:
    - pip
    - pytest

about:
  home: https://pypi.org/project/inflate64
  summary: deflate64 compression/decompression library
  description: A python package to provide Deflater and Inflater class to compress and decompress with Enhanced Deflate compression algorithm.
  license: LGPL-2.1-or-later
  license_family: LGPL
  license_file: COPYING
  dev_url: https://codeberg.org/miurahr/inflate64
  doc_url: https://inflate64.readthedocs.io

extra:
  recipe-maintainers:
    - sarthakpati
